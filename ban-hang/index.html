<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quầy — Bán hàng & quản lý cửa hàng</title>
<meta name="description" content="Quầy: phần mềm bán hàng tại quầy, quản lý đơn hàng, sản phẩm, tồn kho, khách hàng và báo cáo doanh thu cho cửa hàng nhỏ.">
<meta name="theme-color" content="#f5f6f8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235046e5'/%3E%3Cpath d='M9 12h14l-1.5 10h-11z' fill='white'/%3E%3Cpath d='M12.5 12a3.5 3.5 0 0 1 7 0' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f8f9fb; --surface-3:#eff1f5;
  --line:#e7e9ef; --line-2:#d8dbe3;
  --text:#0f1218; --text-2:#4b5262; --text-3:#8a91a1;
  --accent:#5046e5; --accent-hover:#4338ca; --accent-soft:#eef0ff; --accent-ink:#ffffff;
  --green:#0f9f58; --green-soft:#e6f6ee;
  --red:#e2474c; --red-soft:#fdecec;
  --amber:#c27c00; --amber-soft:#fff3dc;
  --sky:#0b8fd6; --pink:#c026d3;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05);
  --shadow-lg:0 24px 48px -12px rgba(16,24,40,.22),0 2px 6px rgba(16,24,40,.06);
  --radius:16px; --radius-sm:10px;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --side:252px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b0c0f; --surface:#14161b; --surface-2:#191b21; --surface-3:#20232a;
  --line:#252831; --line-2:#323642;
  --text:#eef0f4; --text-2:#b3b9c6; --text-3:#7b8292;
  --accent:#8b85ff; --accent-hover:#a19cff; --accent-soft:#23224a; --accent-ink:#0b0c0f;
  --green:#3dd68c; --green-soft:#11291e;
  --red:#ff6b6f; --red-soft:#2e1517;
  --amber:#f5b546; --amber-soft:#2d2210;
  --sky:#4cc0ff; --pink:#e879f9;
  --shadow:0 0 0 1px rgba(255,255,255,.01);
  --shadow-lg:0 24px 48px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* =========================================================
   LAYOUT
   ========================================================= */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:18px 14px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand-sub{font-size:12px;color:var(--text-3);line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--text-2);text-decoration:none;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface-3);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .kbd{margin-left:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.store-card{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0;white-space:nowrap}
.top .spacer{flex:1}
.searchbtn{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 12px;min-width:240px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text-3);transition:border-color .15s}
.searchbtn:hover{border-color:var(--line-2)}
.searchbtn span{flex:1;text-align:left}
.kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-3)}
.view{padding:8px 28px 40px;max-width:1440px;width:100%}
.view.full{max-width:none;padding:0}

/* =========================================================
   PRIMITIVES
   ========================================================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:18px 20px 0}
.card-h h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.card-h .sub{color:var(--text-3);font-size:13px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px 20px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--text);transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.lg{height:52px;font-size:16px;border-radius:14px;padding:0 20px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--text-2);transition:background .15s}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn.sm{width:30px;height:30px;border-radius:8px}
.seg{display:inline-flex;padding:3px;background:var(--surface-3);border-radius:10px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-weight:550;font-size:13px;color:var(--text-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.08)}
:root[data-theme="dark"] .seg button.on{background:var(--line-2)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--text-2)}
.field .hint{font-size:12px;color:var(--text-3)}
.input,.select,.textarea{height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
.textarea{height:auto;padding:10px 12px;resize:vertical;min-height:80px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap svg{position:absolute;left:12px;color:var(--text-3);pointer-events:none}
.input-wrap .input{padding-left:38px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .span2{grid-column:1/-1}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.empty{padding:48px 20px;text-align:center;color:var(--text-3)}
.empty svg{margin:0 auto 10px;color:var(--line-2)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .spacer{flex:1}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--text-3);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl th:first-child{border-top-left-radius:var(--radius)}
.tbl th:last-child{border-top-right-radius:var(--radius)}
.cell-main{font-weight:600}
.cell-sub{font-size:12px;color:var(--text-3)}
.tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none;letter-spacing:-.02em}

/* =========================================================
   DASHBOARD
   ========================================================= */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:8px 0 20px}
.hello h2{margin:0;font-size:26px;letter-spacing:-.03em;font-weight:750}
.hello p{margin:4px 0 0;color:var(--text-3)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:18px 20px 14px;position:relative;overflow:hidden}
.kpi .lbl{color:var(--text-2);font-weight:550;font-size:13px;display:flex;align-items:center;gap:8px}
.kpi .val{font-size:26px;font-weight:750;letter-spacing:-.03em;margin:6px 0 4px}
.kpi .foot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3)}
.kpi .spark{position:absolute;right:16px;bottom:14px;opacity:.9}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:650;font-size:12.5px}
.delta.up{color:var(--green)} .delta.down{color:var(--red)} .delta.flat{color:var(--text-3)}
.dash-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.chart{width:100%;position:relative}
.chart svg text{font-family:var(--font);font-size:11px;fill:var(--text-3)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item .grow .cell-main{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.stackbar{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 16px}
.stackbar i{display:block;height:100%}
.alert-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-weight:550;font-size:13px}
.tooltip{position:fixed;z-index:200;pointer-events:none;background:var(--text);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.45;box-shadow:var(--shadow-lg);white-space:nowrap;opacity:0;transition:opacity .1s}
.tooltip.show{opacity:1}
.tooltip b{font-weight:700}
.heat{display:grid;gap:3px;font-size:11px;color:var(--text-3)}
.heat .c{aspect-ratio:1;border-radius:4px;min-width:0}

/* =========================================================
   POS
   ========================================================= */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(100vh - 67px)}
.pos-left{display:flex;flex-direction:column;min-width:0;padding:4px 24px 24px 28px;overflow:hidden}
.pos-bar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.pos-bar .input-wrap{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:550;white-space:nowrap;color:var(--text-2);transition:all .15s}
.chip:hover{border-color:var(--line-2);color:var(--text)}
.chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip .c{color:var(--text-3);font-weight:500;margin-left:4px}
.chip.on .c{color:inherit;opacity:.6}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;overflow-y:auto;padding:2px 2px 20px;align-content:start}
.prod{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface);transition:border-color .15s,box-shadow .15s,transform .1s}
.prod:hover{border-color:var(--line-2);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.prod:active{transform:scale(.98)}
.prod .tile{width:44px;height:44px;border-radius:12px;font-size:15px}
.prod .nm{font-weight:600;line-height:1.3;min-height:2.6em}
.prod .pr{font-weight:700;color:var(--text)}
.prod .qty-badge{position:absolute;top:10px;right:10px;min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;display:grid;place-items:center}
.prod .stock{position:absolute;top:12px;right:12px}
.prod:disabled{opacity:.5}
.prod.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(.96)}}
.cart{display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--surface);min-height:0}
.cart-h{display:flex;align-items:center;gap:8px;padding:18px 20px 12px}
.cart-h h3{margin:0;font-size:16px}
.cart-cust{margin:0 20px 8px;display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--line-2);border-radius:12px;color:var(--text-2);text-align:left;width:calc(100% - 40px)}
.cart-cust.set{border-style:solid;background:var(--surface-2);color:var(--text)}
.cart-lines{flex:1;overflow-y:auto;padding:0 20px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line .nm{font-weight:600}
.line .unit{font-size:12px;color:var(--text-3)}
.line .tot{text-align:right;font-weight:650}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;height:32px;justify-self:start}
.stepper button{width:30px;height:30px;display:grid;place-items:center;color:var(--text-2)}
.stepper button:hover{color:var(--text)}
.stepper span{min-width:26px;text-align:center;font-weight:650}
.cart-foot{padding:14px 20px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
.sum-row{display:flex;justify-content:space-between;padding:3px 0;color:var(--text-2)}
.sum-row.total{font-size:20px;font-weight:750;color:var(--text);padding:8px 0 14px;letter-spacing:-.02em}
.link{color:var(--accent);font-weight:600}
.cart-fab{display:none}

/* =========================================================
   OVERLAYS
   ========================================================= */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(10,12,18,.45);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-lg);animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;gap:10px;padding:20px 22px 6px}
.modal-h h3{margin:0;font-size:18px;letter-spacing:-.02em}
.modal-h .icon-btn{margin-left:auto}
.modal-b{padding:14px 22px 22px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px 20px;border-top:1px solid var(--line)}
.overlay.drawer-o{justify-content:flex-end;padding:0}
.drawer{width:min(480px,100%);height:100%;overflow:auto;background:var(--surface);box-shadow:var(--shadow-lg);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:550;box-shadow:var(--shadow-lg);animation:pop .2s}
.toast svg{color:var(--green)}
.pay-methods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.pm{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1.5px solid var(--line);border-radius:14px;font-weight:600;font-size:12.5px;color:var(--text-2);transition:all .15s}
.pm:hover{border-color:var(--line-2)}
.pm.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.due{text-align:center;padding:6px 0 18px}
.due .lbl{color:var(--text-3);font-weight:550}
.due .amt{font-size:40px;font-weight:800;letter-spacing:-.04em}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.change{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:12px;background:var(--green-soft);color:var(--green);font-weight:650;margin-top:14px;font-size:15px}
.change.neg{background:var(--red-soft);color:var(--red)}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.qr-box svg{border-radius:12px;background:#fff;padding:10px;border:1px solid var(--line)}
.success{text-align:center;padding:20px 0 4px}
.success .ring{width:72px;height:72px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 14px;animation:pop .3s}
.receipt{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px dashed var(--line-2);border-radius:12px;padding:18px;margin-top:16px;color:var(--text)}
.receipt .c{text-align:center}
.receipt .r{display:flex;justify-content:space-between;gap:12px}
.receipt hr{border:0;border-top:1px dashed var(--line-2);margin:10px 0}
.palette{max-width:600px;align-self:flex-start;margin-top:12vh}
.palette .pin{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.palette .pin input{flex:1;border:0;outline:0;background:none;font-size:16px}
.palette .res{max-height:52vh;overflow:auto;padding:8px}
.palette .grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:650;padding:10px 10px 6px}
.palette .it{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:10px;text-align:left}

  const pickHour=()=>{let r=R()*hSum;for(const h of HOURS){r-=h[1];if(r<=0)return h[0]}return 12};
  const MW=[['cash',34],['qr',42],['card',12],['wallet',12]];
  const pickMethod=()=>{let r=R()*100;for(const m of MW){r-=m[1];if(r<=0)return m[0]}return 'cash'};
  const orders=[];const now=Date.now();const today=sod(now);const nowH=new Date(now).getHours()+new Date(now).getMinutes()/60;
  const DAYS=70;
  for(let d=DAYS-1;d>=0;d--){
    const day=today-d*DAY;const wd=new Date(day).getDay();const weekend=wd===0||wd===6;
    const growth=.78+.22*(DAYS-d)/DAYS;
    const n=Math.round((17+(weekend?9:0)+R()*10)*growth);
    for(let k=0;k<n;k++){
      const h=pickHour();const m=Math.floor(R()*60);
      if(d===0&&h+m/60>nowH)continue;
      const ts=day+h*3600e3+m*60e3+Math.floor(R()*60e3);
      const nItems=R()<.5?1:R()<.7?2:R()<.8?3:4;const items=[];
      for(let j=0;j<nItems;j++){const p=pickProd();const ex=items.find(x=>x.p===p.id);if(ex)ex.q++;else items.push({p:p.id,n:p.name,q:R()<.12?2:1,pr:p.price,c:p.cost})}
      const sub=items.reduce((a,b)=>a+b.q*b.pr,0);
      const disc=R()<.08?Math.round(sub*.1/1000)*1000:0;
      const cust=R()<.45?pick(customers).id:null;
      orders.push({id:uid(),no:0,ts,items,sub,disc,tax:0,total:sub-disc,method:pickMethod(),cust,status:R()<.015?'refunded':'paid',note:''});
    }
  }
  orders.sort((a,b)=>a.ts-b.ts);orders.forEach((o,i)=>o.no=1001+i);
  for(const c of customers){const f=orders.find(o=>o.cust===c.id);c.created=f?f.ts:now-30*DAY}
  const B=seedBookings(R,customers);
  return {v:2,settings:{store:'Nhà Mộc Café',address:'12 Nguyễn Thị Minh Khai, Q.1, TP.HCM',phone:'0909 123 456',tax:0,theme:'auto',bank:'VCB · 0123456789'},categories,products,customers,orders,seq:1001+orders.length,...B};
}
function seedBookings(R,customers){
  const staff=[{id:'s1',name:'Minh Anh',color:'#5046e5'},{id:'s2',name:'Hoàng Nam',color:'#0b8fd6'},{id:'s3',name:'Thu Trang',color:'#c026d3'}];
  const services=[{id:'v1',name:'Đặt bàn 2–4 người',dur:90,price:0},{id:'v2',name:'Đặt bàn nhóm 6–10 người',dur:120,price:0},{id:'v3',name:'Workshop latte art',dur:90,price:350000},{id:'v4',name:'Tiệc sinh nhật nhỏ',dur:150,price:1500000},{id:'v5',name:'Tư vấn mở quán cà phê',dur:60,price:500000}];
  const bookings=[];const now=Date.now(),today=sod(now);
  for(let d=-21;d<=10;d++){
    const day=today+d*DAY;
    for(const s of staff){
      let t=8*60+Math.floor(R()*4)*30;let left=1+Math.floor(R()*3);
      while(left-->0){
        const sv=services[Math.floor(R()*services.length)];if(t+sv.dur>21*60)break;
        const ts=day+t*60e3,end=ts+sv.dur*60e3;const c=R()<.7?customers[Math.floor(R()*customers.length)]:null;
        let status='booked';
        if(end<now){const r=R();status=r<.78?'done':r<.9?'noshow':'cancelled'}else if(ts<now)status='arrived';else if(R()<.06)status='cancelled';
        bookings.push({id:uid(),ts,dur:sv.dur,svc:sv.id,price:sv.price,staff:s.id,cust:c?c.id:null,name:c?c.name:'Khách vãng lai',phone:c?c.phone:'',status,note:'',src:R()<.4?'online':'staff',created:ts-3*DAY});
        t+=sv.dur+Math.floor(1+R()*5)*30;
      }
    }
  }
  return {staff,services,bookings};
}

function summarize(list){
  const r={net:0,count:0,gross:0,disc:0,tax:0,cost:0,refunds:0,refundAmt:0,items:0,cust:new Set()};
  for(const o of list){
    if(!isPaid(o)){r.refunds++;r.refundAmt+=o.total;continue}
    r.net+=o.total;r.count++;r.gross+=o.sub;r.disc+=o.disc;r.tax+=o.tax||0;
    for(const i of o.items){r.cost+=(i.c||0)*i.q;r.items+=i.q}
    if(o.cust)r.cust.add(o.cust);
  }
  r.aov=r.count?r.net/r.count:0;r.profit=r.net-r.tax-r.cost;r.customers=r.cust.size;return r;
}

function bounds(key){
  const now=Date.now(),t0=sod(now);let start,prevStart,prevEnd,buckets=[];
  if(key==='today'){start=t0;prevStart=t0-DAY;prevEnd=now-DAY;for(let h=6;h<=22;h++)buckets.push({a:start+h*3600e3,b:start+(h+1)*3600e3,pa:prevStart+h*3600e3,pb:prevStart+(h+1)*3600e3,label:h+'h'})}
  else{
    let days;
    if(key==='month'){const d=new Date(now);start=new Date(d.getFullYear(),d.getMonth(),1).getTime();days=Math.round((t0-start)/DAY)+1;const pd=new Date(d.getFullYear(),d.getMonth()-1,1).getTime();prevStart=pd;prevEnd=Math.min(start,pd+(now-start))}
    else{days=key==='7d'?7:30;start=t0-(days-1)*DAY;prevStart=start-days*DAY;prevEnd=now-days*DAY}
    for(let i=0;i<days;i++){const a=start+i*DAY;const pa=prevStart+i*DAY;buckets.push({a,b:a+DAY,pa,pb:pa+DAY,label:days<=7?WD[new Date(a).getDay()]+' '+new Date(a).getDate():fDate(a)})}
  }
  return {start,end:now,prevStart,prevEnd,buckets};
}

const CH={};let chartN=0;
function chartSlot(spec){const id='ch'+(++chartN);CH[id]=spec;return `<div class="chart" data-chart="${id}" style="height:${spec.h||260}px"></div>`}
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const n=v/e;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*e}
function drawCharts(){
  document.querySelectorAll('[data-chart]').forEach(el=>{
    const s=CH[el.dataset.chart];if(!s)return;const W=Math.max(200,el.clientWidth),H=s.h||260;
    el.innerHTML=s.type==='bars'?barsSvg(s,W,H):sparkSvg(s,W,H);
  });
}
function barsSvg(s,W,H){
  const pl=44,pr=8,pt=10,pb=26;const iw=W-pl-pr,ih=H-pt-pb;const d=s.data;const n=d.length;
  const max=niceMax(Math.max(1,...d.map(x=>Math.max(x.v,x.p||0))));
  const step=iw/n;const bw=Math.max(3,Math.min(28,step*.62));
  let g='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" ${i?'stroke-dasharray="3 4"':''}/><text x="${pl-8}" y="${y+4}" text-anchor="end">${compact(max*i/4)}</text>`}
  let bars='',line='',hits='';const pts=[];
  const every=Math.ceil(n/(W<500?6:12));
  d.forEach((x,i)=>{
    const cx=pl+step*i+step/2;const bh=ih*x.v/max;
    bars+=`<rect x="${cx-bw/2}" y="${pt+ih-bh}" width="${bw}" height="${Math.max(0,bh)}" rx="${Math.min(6,bw/2.5)}" fill="var(--accent)"/>`;
    if(s.prev)pts.push([cx,pt+ih-ih*(x.p||0)/max]);
    if(i%every===0||i===n-1&&n<=12)g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(x.label)}</text>`;
    const tip=`${x.full||x.label}\n${s.fmt(x.v)}`+(s.prev?`\nKỳ trước: ${s.fmt(x.p||0)}`:'')+(x.extra?'\n'+x.extra:'');
    hits+=`<rect class="hit" x="${pl+step*i}" y="${pt}" width="${step}" height="${ih}" fill="transparent" data-tip="${esc(tip)}"/>`;
  });
  if(pts.length)line=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}" fill="none" stroke="var(--text-3)" stroke-width="1.6" stroke-dasharray="4 4" stroke-linejoin="round" opacity=".7"/>`;
  return `<svg width="${W}" height="${H}" role="img" aria-label="${esc(s.label||'Biểu đồ')}">${g}${bars}${line}${hits}</svg>`;
}
function sparkSvg(s,W,H){
  const d=s.data;const max=Math.max(1,...d);const min=Math.min(...d);const r=max-min||1;
  const pts=d.map((v,i)=>[(i/(d.length-1||1))*(W-2)+1,H-2-((v-min)/r)*(H-4)]);
  const p=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
  return `<svg width="${W}" height="${H}" aria-hidden="true"><path d="${p}L${W-1} ${H}L1 ${H}Z" fill="var(--accent)" opacity=".08"/><path d="${p}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function cartTotals(){
  let sub=0,qty=0;for(const [pid,q] of cart.lines){const p=lineInfo(pid);if(!p)continue;sub+=p.price*q;qty+=q}
  const disc=Math.min(sub,cart.disc.type==='pct'?Math.round(sub*cart.disc.v/100):cart.disc.v);
  const base=sub-disc;const tax=Math.round(base*(+S.settings.tax||0)/100);
  return {sub,qty,disc,tax,total:base+tax};
}

function completeSale(method,given){
  const T=cartTotals();
  const items=[...cart.lines].map(([pid,q])=>{const p=lineInfo(pid);if(!p)return null;if(!p.svc)p.stock=Math.max(0,p.stock-q);return {p:pid,n:p.name,q,pr:p.price,c:p.cost}}).filter(Boolean);
  const o={id:uid(),no:S.seq++,ts:Date.now(),items,sub:T.sub,disc:T.disc,tax:T.tax,total:T.total,method,cust:cart.cust,status:'paid',note:cart.note,given};
  S.orders.push(o);
  if(cart.booking){const b=S.bookings.find(x=>x.id===cart.booking);if(b){b.status='done';b.order=o.id}}
  save();
  cart.lines.clear();cart.cust=null;cart.disc={type:'pct',v:0};cart.note='';cart.booking=null;
  refreshPOS();const ce=$('#cart');ce&&ce.classList.remove('open');
  return o;
}

function qrSvg(seed){
  const N=25,R=mulberry32(seed|0);let cells='';const s=7;
  const finder=(x,y)=>{cells+=`<rect x="${x*s}" y="${y*s}" width="${7*s}" height="${7*s}" fill="#111"/><rect x="${(x+1)*s}" y="${(y+1)*s}" width="${5*s}" height="${5*s}" fill="#fff"/><rect x="${(x+2)*s}" y="${(y+2)*s}" width="${3*s}" height="${3*s}" fill="#111"/>`};
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y))continue;if(R()<.48)cells+=`<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}" fill="#111"/>`}
  finder(0,0);finder(N-7,0);finder(0,N-7);
  return `<svg width="196" height="196" viewBox="0 0 ${N*s} ${N*s}" role="img" aria-label="Mã QR thanh toán minh hoạ">${cells}</svg>`;
}

/* =========================================================
   VIEW: REPORTS
   ========================================================= */
function vReports(){
  const B=bounds(UI.rRange);const cur=ordersBetween(B.start,B.end),prev=ordersBetween(B.prevStart,B.prevEnd);
  const a=summarize(cur),b=summarize(prev);
  // categories
  const cm={};for(const o of cur){if(!isPaid(o))continue;const f=o.sub?o.total/o.sub:1;for(const i of o.items){const p=prodById(i.p);const k=p?p.cat:String(i.p).startsWith('svc:')?'svc':'other';cm[k]=(cm[k]||0)+i.q*i.pr*f}}
  const cats=Object.entries(cm).sort((x,y)=>y[1]-x[1]);const cmax=cats[0]?cats[0][1]:1;
  // heatmap weekday x hour
  const H0=7,H1=21;const heat=Array.from({length:7},()=>Array(H1-H0+1).fill(0));
  for(const o of cur){if(!isPaid(o))continue;const d=new Date(o.ts);const h=d.getHours();if(h<H0||h>H1)continue;heat[(d.getDay()+6)%7][h-H0]+=o.total}
  const hmax=Math.max(1,...heat.flat());
  const WDO=['T2','T3','T4','T5','T6','T7','CN'];
  // products table
  const pm={};for(const o of cur){if(!isPaid(o))continue;for(const i of o.items){const r=pm[i.p]=pm[i.p]||{n:i.n,q:0,v:0,c:0};r.q+=i.q;r.v+=i.q*i.pr;r.c+=i.q*(i.c||0)}}
  const prods=Object.entries(pm).sort((x,y)=>y[1].v-x[1].v);
  const card=(l,v,cv,pv,neg)=>`<div class="card kpi"><div class="lbl">${l}</div><div class="val num" style="font-size:22px">${v}</div><div class="foot">${pv===undefined?'':deltaHtml(cv,pv,neg)}</div></div>`;
  return `<div class="hello"><div><h2>Báo cáo bán hàng</h2><p>${fDateY(B.start)} – ${fDateY(B.end)}</p></div>
  <div class="row" style="flex-wrap:wrap"><div class="seg">${Object.entries(RANGES).map(([k,v])=>`<button data-act="r-range" data-v="${k}" class="${UI.rRange===k?'on':''}">${v}</button>`).join('')}</div><button class="btn" data-act="export-csv" data-v="range">${ic('download')}Xuất CSV</button></div></div>
  <div class="kpis">
    ${card('Doanh thu gộp',money(a.gross),a.gross,b.gross)}
    ${card('Giảm giá & hoàn tiền',money(a.disc+a.refundAmt),a.disc+a.refundAmt,b.disc+b.refundAmt,true)}
    ${card('Doanh thu ròng',money(a.net),a.net,b.net)}
    ${card('Lợi nhuận gộp',money(a.profit)+` <span style="font-size:13px;color:var(--text-3);font-weight:600">${a.net?Math.round(a.profit/a.net*100):0}%</span>`,a.profit,b.profit)}
  </div>
  <div class="dash-grid">
    <div class="card"><div class="card-h"><div><h3>Giờ cao điểm</h3><div class="sub">Doanh thu theo thứ & giờ — ô càng đậm càng đông khách</div></div></div>

  const check=()=>{const r=read();const w=$('#bf-w',el);if(!r.day){w.textContent='';return true}const clash=S.bookings.find(x=>x.staff===r.staff&&overlaps(x,r.ts,r.sv.dur,id));const over=r.min+r.sv.dur>TL.H1*60;w.innerHTML=clash?`<span style="color:var(--red);font-weight:600">${ic('alert',14)} Trùng lịch với ${esc(clash.name)} (${fTime(clash.ts)})</span>`:over?`<span style="color:var(--amber);font-weight:600">Kết thúc sau ${TL.H1}:00</span>`:`<span style="color:var(--green);font-weight:600">${ic('check',14)} Kết thúc lúc ${hm(r.min+r.sv.dur)}</span>`;return !clash};
  ['#bf-s','#bf-st','#bf-d','#bf-t'].forEach(s=>$(s,el).addEventListener('change',check));check();
  $('#bf-n',el).addEventListener('change',()=>{const c=S.customers.find(x=>x.name===$('#bf-n',el).value);if(c&&!$('#bf-p',el).value)$('#bf-p',el).value=c.phone});
  $('#bf-n',el).focus();
  const submit=()=>{
    const name=$('#bf-n',el).value.trim(),phone=$('#bf-p',el).value.replace(/[^\d+]/g,'');

    if(b)Object.assign(b,data);else S.bookings.push({id:uid(),status:'booked',src:'staff',created:Date.now(),...data});

  };
  $('#bf-ok',el).onclick=submit;$('#bf',el).onsubmit=e=>{e.preventDefault();submit()};
}

function freeSlots(day,sv,staffSel){
  const out=[];const now=Date.now();const staff=staffSel==='any'?S.staff:S.staff.filter(s=>s.id===staffSel);
  for(let m=TL.H0*60;m+sv.dur<=TL.H1*60;m+=30){const ts=day+m*6e4;if(ts<now+30*6e4)continue;const s=staff.find(s=>!S.bookings.some(b=>b.staff===s.id&&overlaps(b,ts,sv.dur)));if(s)out.push({ts,m,staff:s.id})}

}

  const head=`<div class="pub-head"><div class="brand-mark">${ic('bag',24,2.2)}</div><div><h2>${esc(st.store)}</h2><div class="muted">${esc(st.address)}</div></div></div>`;
  if(P.done){const b=S.bookings.find(x=>x.id===P.done);if(b){const sv=svcById(b.svc),s=staffById(b.staff);return head+`<div class="card card-b" style="padding:28px"><div class="success" style="padding-top:0"><div class="ring">${ic('check',36,2.4)}</div><h3 style="margin:0;font-size:22px">Đặt lịch thành công!</h3><div class="muted">Hẹn gặp ${esc(b.name)} nhé 💜</div></div>
    <dl class="dl" style="margin-top:20px"><dt>Dịch vụ</dt><dd>${esc(sv.name)}</dd><dt>Thời gian</dt><dd>${fTime(b.ts)} · ${fDayLong(b.ts)}</dd><dt>Nhân viên</dt><dd>${esc(s.name)}</dd><dt>Giá</dt><dd>${b.price?money(b.price):'Miễn phí'}</dd></dl>
    <div class="row" style="margin-top:20px"><button class="btn block" data-act="pb-reset">Đặt lịch khác</button></div>
    <div class="muted" style="text-align:center;margin-top:14px;font-size:12.5px">Cần đổi lịch? Gọi ${esc(st.phone)}</div></div>`}}
  const sv=svcById(P.svc);const t0=sod(Date.now());
  const slots=sv?freeSlots(P.day,sv,P.staff):[];
  return head+`<div class="stack">
  <div class="card card-b"><div class="step"><i>1</i>Chọn dịch vụ</div><div class="stack" style="gap:8px">${S.services.map(s=>`<button class="svc ${P.svc===s.id?'on':''}" data-act="pb-svc" data-v="${s.id}"><div class="tile" style="background:var(--accent);opacity:${P.svc===s.id?1:.85}">${ic('calendar',18,2)}</div><div class="grow"><div class="cell-main">${esc(s.name)}</div><div class="cell-sub">${ic('clock',12)} ${s.dur} phút</div></div><b class="num">${s.price?money(s.price):'Miễn phí'}</b></button>`).join('')}</div></div>
  ${sv?`<div class="card card-b"><div class="step"><i>2</i>Chọn thời gian</div>
    <div class="chips" style="padding-bottom:12px">${[{id:'any',name:'Bất kỳ ai'},...S.staff].map(s=>`<button class="chip ${P.staff===s.id?'on':''}" data-act="pb-staff" data-v="${s.id}">${esc(s.name)}</button>`).join('')}</div>
    <div class="days">${Array.from({length:14},(_,i)=>{const d=t0+i*DAY;return `<button class="dayb ${P.day===d?'on':''}" data-act="pb-day" data-v="${d}"><small>${i===0?'Nay':WD[new Date(d).getDay()]}</small><b class="num">${new Date(d).getDate()}</b></button>`}).join('')}</div>
    ${slots.length?`<div class="slots">${slots.map(x=>`<button class="slot ${P.slot&&P.slot.ts===x.ts?'on':''}" data-act="pb-slot" data-v="${x.ts}" data-s="${x.staff}">${hm(x.m)}</button>`).join('')}</div>`:`<div class="empty" style="padding:24px">${ic('calendar',32,1.4)}Ngày này đã kín lịch — chọn ngày khác nhé</div>`}
  </div>`:''}
  ${P.slot?`<div class="card card-b"><div class="step"><i>3</i>Thông tin của bạn</div><div class="form-grid">
    <div class="field"><label for="pb-name">Họ tên</label><input class="input" id="pb-name" value="${esc(P.name)}" autocomplete="name"></div>
    <div class="field"><label for="pb-phone">Số điện thoại</label><input class="input" id="pb-phone" inputmode="tel" value="${esc(P.phone)}" autocomplete="tel"></div>
    <div class="field span2"><label for="pb-note">Ghi chú (không bắt buộc)</label><textarea class="textarea" id="pb-note" style="min-height:64px">${esc(P.note)}</textarea></div></div>
    <div style="margin-top:16px;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)" class="row"><div style="flex:1"><div class="cell-main">${esc(sv.name)}</div><div class="cell-sub">${fTime(P.slot.ts)} · ${fDayLong(P.slot.ts)} · ${esc(staffById(P.slot.staff).name)}</div></div><b class="num">${sv.price?money(sv.price):'Miễn phí'}</b></div>
    <button class="btn primary lg block" style="margin-top:14px" data-act="pb-submit">Xác nhận đặt lịch</button></div>`:''}
  <div style="text-align:center"><a href="#/lich-hen" class="muted" style="font-size:12.5px">← Trang quản lý (chỉ chủ cửa hàng)</a></div>
  </div>`;
}

const VIEWS={'dat-lich':vPublic,'lich-hen':vBookings,'tong-quan':vDashboard,'ban-hang':vPOS,'don-hang':vOrders,'san-pham':vProducts,'khach-hang':vCustomers,'bao-cao':vReports,'cai-dat':vSettings};

/* =========================================================
   OVERLAYS
   ========================================================= */
let lastFocus=null;
function openModal(html,cls=''){closeOverlay(true);lastFocus=document.activeElement;const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;o.addEventListener('mousedown',e=>{if(e.target===o)closeOverlay()});$('#overlay-root').appendChild(o);return o.firstElementChild}
function openDrawer(html){closeOverlay(true);lastFocus=document.activeElement;const o=document.createElement('div');o.className='overlay drawer-o';o.innerHTML=`<div class="drawer" role="dialog" aria-modal="true">${html}</div>`;o.addEventListener('mousedown',e=>{if(e.target===o)closeOverlay()});$('#overlay-root').appendChild(o);const f=o.querySelector('button');f&&f.focus();return o.firstElementChild}
function closeOverlay(keepFocus){$('#overlay-root').innerHTML='';if(!keepFocus&&lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function confirmBox(title,msg,okLabel,fn){const el=openModal(`<div class="modal-h"><h3>${esc(title)}</h3></div><div class="modal-b muted">${esc(msg)}</div><div class="modal-f"><button class="btn" data-act="close">Huỷ</button><button class="btn primary" id="cb-ok" style="background:var(--red);border-color:var(--red);color:#fff">${esc(okLabel)}</button></div>`);$('#cb-ok',el).onclick=()=>{closeOverlay();fn()};$('#cb-ok',el).focus()}
function toast(msg,icon='check'){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=ic(icon,18,2.2)+esc(msg);if(icon==='alert')t.querySelector('svg').style.color='var(--amber)';$('#toasts').appendChild(t);setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),300)},2400)}

function openPalette(){
  const el=openModal(`<div class="pin">${ic('search',20)}<input id="pq" placeholder="Tìm trang, món, khách hàng, mã đơn…" autocomplete="off" aria-label="Tìm kiếm"><kbd class="kbd">Esc</kbd></div><div class="res" id="pr"></div>`,'palette');
  const inp=$('#pq',el);let sel=0,items=[];
  const build=()=>{
    const q=inp.value.trim().toLowerCase();items=[];
    const pages=ROUTES.filter(r=>!q||r.label.toLowerCase().includes(q)).map(r=>({g:'Trang',icon:r.icon,label:r.label,run:()=>go(r.id)}));
    const acts=[{label:'Tạo đơn mới',icon:'plus',run:()=>go('ban-hang')},{label:'Tạo lịch hẹn',icon:'calendar',run:()=>openBookingForm()},{label:'Thêm món mới',icon:'box',run:()=>openProductForm()},{label:'Thêm khách hàng',icon:'user',run:()=>openCustomerForm()},{label:'Đổi giao diện sáng / tối',icon:'moon',run:toggleTheme}].filter(a=>!q||a.label.toLowerCase().includes(q)).map(a=>({g:'Thao tác',...a}));
    items.push(...acts,...pages);
    if(q){
      S.products.filter(p=>p.name.toLowerCase().includes(q)).slice(0,5).forEach(p=>items.push({g:'Món — Enter để thêm vào đơn',icon:'box',label:p.name,right:money(p.price),run:()=>{go('ban-hang');setTimeout(()=>addToCart(p.id),30)}}));
      S.customers.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q)).slice(0,5).forEach(c=>items.push({g:'Khách hàng',icon:'user',label:c.name,right:c.phone,run:()=>openCustomer(c.id)}));
      const n=q.replace(/^#/,'');if(/^\d+$/.test(n))S.orders.filter(o=>String(o.no).startsWith(n)).slice(-5).reverse().forEach(o=>items.push({g:'Đơn hàng',icon:'receipt',label:'#'+o.no,right:money(o.total)+' · '+fDate(o.ts),run:()=>openOrder(o.id)}));
    }
    sel=Math.min(sel,Math.max(0,items.length-1));
    let g='',h='';items.forEach((it,i)=>{if(it.g!==g){g=it.g;h+=`<div class="grp">${esc(g)}</div>`}h+=`<button class="it ${i===sel?'on':''}" data-ix="${i}">${ic(it.icon)}<span>${esc(it.label)}</span>${it.right?`<span class="r num">${esc(it.right)}</span>`:''}</button>`});
    $('#pr',el).innerHTML=h||'<div class="empty">Không có kết quả</div>';
    el.querySelectorAll('[data-ix]').forEach(b=>{b.onclick=()=>run(+b.dataset.ix);b.onmousemove=()=>{if(sel!==+b.dataset.ix){sel=+b.dataset.ix;el.querySelectorAll('[data-ix]').forEach(x=>x.classList.toggle('on',+x.dataset.ix===sel))}}});
  };
  const run=i=>{const it=items[i];if(!it)return;closeOverlay(true);it.run()};
  inp.oninput=()=>{sel=0;build()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(items.length-1,sel+1);build();e.preventDefault();el.querySelector('.it.on')?.scrollIntoView({block:'nearest'})}else if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);build();e.preventDefault();el.querySelector('.it.on')?.scrollIntoView({block:'nearest'})}else if(e.key==='Enter'){run(sel)}};
  build();inp.focus();
}
function openMoreMenu(){
  const el=openModal(`<div class="modal-h"><h3>Thêm</h3><button class="icon-btn" data-act="close" aria-label="Đóng">${ic('x')}</button></div><div class="modal-b palette" style="margin:0;max-width:none">${ROUTES.map(r=>r.id).filter(id=>!BN.includes(id)).map(id=>{const r=ROUTES.find(x=>x.id===id);return `<a class="it" href="#/${id}" style="text-decoration:none;color:inherit;padding:14px 10px">${ic(r.icon)}<span style="font-weight:600">${r.label}</span><span class="r">${ic('chevron',16)}</span></a>`}).join('')}<button class="it" data-act="theme" style="padding:14px 10px">${ic('moon')}<span style="font-weight:600">Đổi giao diện sáng / tối</span></button></div>`);
}

/* =========================================================
   THEME
   ========================================================= */
function applyTheme(){const t=S.settings.theme;const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';$('meta[name=theme-color]').content=dark?'#0b0c0f':'#f5f6f8'}
function toggleTheme(){S.settings.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();applyTheme();render()}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.settings.theme==='auto'){applyTheme();render()}});

/* =========================================================
   EXPORT
   ========================================================= */
function download(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvCell=v=>{v=String(v??'');return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function exportOrders(list){const rows=[['Mã đơn','Ngày','Giờ','Khách hàng','SĐT','Món','Tạm tính','Giảm giá','VAT','Tổng','Phương thức','Trạng thái']];for(const o of list){const c=custById(o.cust);rows.push([o.no,fDateY(o.ts),fTime(o.ts),c?c.name:'Khách lẻ',c?c.phone:'',o.items.map(i=>i.q+'x '+i.n).join('; '),o.sub,o.disc,o.tax||0,o.total,METHODS[o.method].label,isPaid(o)?'Đã thu':'Đã hoàn'])}download('don-hang.csv','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');toast('Đã xuất '+list.length+' đơn')}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const v=t.dataset.v;
  switch(t.dataset.act){
    case 'go':go(v);break;
    case 'theme':toggleTheme();break;
    case 'palette':openPalette();break;
    case 'more-menu':openMoreMenu();break;
    case 'close':closeOverlay();break;
    case 'print':window.print();break;
    case 'range':UI.range=v;render();break;
    case 'r-range':UI.rRange=v;render();break;
    case 'pos-cat':UI.posCat=v;document.querySelectorAll('.chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));refreshPOS();break;
    case 'add':addToCart(v);break;
    case 'inc':addToCart(v);break;
    case 'dec':{const q=(cart.lines.get(v)||0)-1;if(q<=0)cart.lines.delete(v);else cart.lines.set(v,q);refreshPOS();break}
    case 'cart-clear':cart.lines.clear();cart.disc={type:'pct',v:0};cart.cust=null;refreshPOS();break;
    case 'cart-cust':if(cart.cust){cart.cust=null;refreshPOS()}else openCustomerPicker();break;
    case 'cart-disc':openDiscount();break;
    case 'cart-open':{const c=$('#cart');c.classList.add('open');$('.cart-close',c).style.display='';break}
    case 'cart-close':$('#cart').classList.remove('open');break;
    case 'checkout':openCheckout();break;
    case 'order':openOrder(v);break;
    case 'refund':{const o=S.orders.find(x=>x.id===v);confirmBox('Hoàn tiền đơn #'+o.no+'?','Khách sẽ được hoàn '+money(o.total)+'. Số lượng món được cộng lại vào kho.','Hoàn tiền',()=>{o.status='refunded';for(const i of o.items){const p=prodById(i.p);if(p)p.stock+=i.q}save();render();openOrder(o.id);toast('Đã hoàn tiền đơn #'+o.no)});break}
    case 'o-status':UI.oStatus=v;UI.oLimit=40;render();break;
    case 'o-more':UI.oLimit+=60;render();break;
    case 'p-cat':UI.pCat=v;render();break;
    case 'product-new':openProductForm();break;
    case 'product-edit':openProductForm(v);break;
    case 'customer':openCustomer(v);break;
    case 'customer-new':openCustomerForm();break;
    case 'customer-edit':openCustomerForm(v);break;
    case 'sell-to':cart.cust=v;closeOverlay(true);if(route()==='ban-hang')refreshPOS();else go('ban-hang');break;
    case 'export-csv':{if(v==='range'){const B=bounds(UI.rRange);exportOrders(ordersBetween(B.start,B.end))}else exportOrders(filteredOrders());break}
    case 'export-cust':{const st=custStats();const rows=[['Tên','SĐT','Email','Số lần mua','Tổng chi','Lần cuối','Ghi chú']];S.customers.forEach(c=>{const s=st[c.id];rows.push([c.name,c.phone,c.email,s.visits,s.spent,s.last?fDateY(s.last):'',c.note])});download('khach-hang.csv','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');toast('Đã xuất danh sách khách');break}
    case 'export-json':download('quay-sao-luu.json',JSON.stringify(S),'application/json');toast('Đã tải bản sao lưu');break;
    case 'reset-demo':confirmBox('Tạo lại dữ liệu mẫu?','Toàn bộ dữ liệu hiện tại sẽ bị thay bằng dữ liệu mẫu.','Tạo lại',()=>{S=seed();cart.lines.clear();cart.cust=null;save();applyTheme();render();toast('Đã tạo lại dữ liệu mẫu')});break;
    case 'clear-all':confirmBox('Xoá toàn bộ đơn & khách?','Sản phẩm và cài đặt được giữ lại. Không thể hoàn tác.','Xoá hết',()=>{S.orders=[];S.customers=[];S.seq=1001;cart.cust=null;save();render();toast('Đã xoá dữ liệu')});break;
    case 'set-theme':S.settings.theme=v;save();applyTheme();render();break;
    // bookings
    case 'b-day':UI.bDate=v==='0'?sod(Date.now()):sod(UI.bDate+(+v)*DAY+DAY/2);render();break;
    case 'slot':{const r=t.getBoundingClientRect();const m=TL.H0*60+Math.floor((e.clientY-r.top)/TL.PX*2)*30;openBookingForm(null,{staff:v,ts:UI.bDate+Math.min(m,(TL.H1*60-30))*6e4});break}
    case 'booking':openBooking(v);break;
    case 'booking-new':openBookingForm(null,t.dataset.c?{cust:t.dataset.c,ts:sod(Date.now())+Math.max(TL.H0*60,Math.ceil((new Date().getHours()*60+new Date().getMinutes()+30)/30)*30)*6e4}:{});break;
    case 'booking-edit':openBookingForm(v);break;
    case 'b-status':{const b=S.bookings.find(x=>x.id===v);b.status=t.dataset.s;save();if(route()==='lich-hen')render();openBooking(b.id);toast(BST[b.status].label+' · '+b.name);break}
    case 'b-pay':{const b=S.bookings.find(x=>x.id===v);cart.lines.clear();cart.lines.set('svc:'+b.svc,1);cart.cust=b.cust;cart.booking=b.id;cart.disc={type:'pct',v:0};closeOverlay(true);if(route()==='ban-hang')refreshPOS();else go('ban-hang');setTimeout(openCheckout,60);break}
    case 'b-del':{const b=S.bookings.find(x=>x.id===v);confirmBox('Xoá lịch của '+b.name+'?','Lịch sẽ bị xoá vĩnh viễn. Nếu khách chỉ huỷ, hãy dùng “Huỷ lịch” để giữ lịch sử.','Xoá',()=>{S.bookings=S.bookings.filter(x=>x.id!==v);save();render();toast('Đã xoá lịch')});break}
    case 'copy-link':{const i=$('#pub-url');i.select();(navigator.clipboard?navigator.clipboard.writeText(i.value):Promise.reject()).then(()=>toast('Đã sao chép link đặt lịch'),()=>{try{document.execCommand('copy');toast('Đã sao chép link đặt lịch')}catch(_){toast('Hãy sao chép thủ công','alert')}});break}
    case 'pb-svc':UI.pb.svc=v;UI.pb.slot=null;render();break;
    case 'pb-staff':UI.pb.staff=v;UI.pb.slot=null;render();break;
    case 'pb-day':UI.pb.day=+v;UI.pb.slot=null;render();break;
    case 'pb-slot':UI.pb.slot={ts:+v,staff:t.dataset.s};render();setTimeout(()=>{const n=$('#pb-name');n&&n.scrollIntoView({behavior:'smooth',block:'center'});n&&!n.value&&n.focus({preventScroll:true})},30);break;
    case 'pb-submit':{const P=UI.pb;const sv=svcById(P.svc);const phone=P.phone.replace(/[^\d+]/g,'');
      if(!P.name.trim()){$('#pb-name').focus();return toast('Bạn nhập giúp họ tên nhé','alert')}
      if(phone.length<9){$('#pb-phone').focus();return toast('Số điện thoại chưa đúng','alert')}
      if(S.bookings.some(b=>b.staff===P.slot.staff&&overlaps(b,P.slot.ts,sv.dur))){P.slot=null;render();return toast('Giờ này vừa có người đặt, chọn giờ khác nhé','alert')}
      let c=S.customers.find(x=>x.phone===phone);if(!c){c={id:'c'+uid(),name:P.name.trim(),phone,email:'',note:'',created:Date.now()};S.customers.push(c)}
      const b={id:uid(),ts:P.slot.ts,dur:sv.dur,svc:sv.id,price:sv.price,staff:P.slot.staff,cust:c.id,name:P.name.trim(),phone,status:'booked',note:P.note.trim(),src:'online',created:Date.now()};
      S.bookings.push(b);save();P.done=b.id;render();window.scrollTo(0,0);break}
    case 'pb-reset':UI.pb={svc:null,staff:'any',day:sod(Date.now()),slot:null,name:UI.pb.name,phone:UI.pb.phone,note:'',done:null};render();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pb-name'||t.id==='pb-phone'||t.id==='pb-note'){UI.pb[t.id.slice(3)]=t.value}
  else if(t.id==='pos-q'){UI.posQ=t.value;refreshPOS()}
  else if(t.id==='o-q'){UI.oQ=t.value;UI.oLimit=40;rerenderKeepFocus(t)}
  else if(t.id==='p-q'){UI.pQ=t.value;rerenderKeepFocus(t)}
  else if(t.id==='c-q'){UI.cQ=t.value;rerenderKeepFocus(t)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='b-date'&&t.value){const [y,m,d]=t.value.split('-').map(Number);UI.bDate=new Date(y,m-1,d).getTime();render()}
  else if(t.id==='o-m'){UI.oMethod=t.value;UI.oLimit=40;render()}
  else if(t.id==='c-s'){UI.cSort=t.value;render()}
  else if(t.dataset.set){const k=t.dataset.set;S.settings[k]=k==='tax'?Math.max(0,Math.min(100,+t.value||0)):t.value.trim();save();renderShell();toast('Đã lưu cài đặt')}
});
function rerenderKeepFocus(input){const id=input.id,pos=input.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(e.key==='Escape'){if($('#overlay-root').children.length)closeOverlay();else $('#cart')?.classList.remove('open');return}
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(typing||$('#overlay-root').children.length||e.ctrlKey||e.metaKey||e.altKey||route()==='dat-lich')return;
  if(e.key==='/'&&route()==='ban-hang'){e.preventDefault();$('#pos-q')?.focus();return}
  const r=ROUTES.find(x=>x.key===e.key);if(r)go(r.id);
});

/* boot */
applyTheme();hydrateIcons();render();
</script>
