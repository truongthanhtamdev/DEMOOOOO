<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý đội xe | Tâm Auto</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">

<!-- ===== cổng đăng nhập (demo: chỉ để xem phân quyền, chưa bảo mật thật) ===== -->
<div id="gate">
  <div class="box">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6.5 17a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zM20.5 17a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/><path d="M3 13.5l1.2-4.2A3 3 0 0 1 7.1 7h9.8a3 3 0 0 1 2.9 2.3l1.2 4.2v3.2H3z"/></svg></span>
      <span>Quản lý đội xe</span>
    </div>
    <p class="small muted" style="margin-bottom:20px">Bản demo — chọn vai trò để xem quyền hạn khác nhau. Khi làm thật sẽ có email và mật khẩu.</p>
    <label class="f"><span>Đăng nhập với vai trò</span>
      <select id="gate-role">
        <option value="owner">Chủ xe — thấy toàn bộ, gồm lãi/lỗ</option>
        <option value="staff">Nhân viên — không thấy lãi/lỗ</option>
      </select>
    </label>
    <label class="f"><span>Tên hiển thị</span><input id="gate-name" value="Anh Tâm"></label>
    <button class="btn lg" id="gate-in" style="width:100%">Vào hệ thống</button>
    <p class="tiny muted center" style="margin:14px 0 0"><a href="index.html">← Về trang khách</a></p>
  </div>
</div>

<div class="app">
  <!-- ============================ SIDEBAR ============================ -->
  <aside class="side" id="side">
    <div class="side-head">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6.5 17a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zM20.5 17a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/><path d="M3 13.5l1.2-4.2A3 3 0 0 1 7.1 7h9.8a3 3 0 0 1 2.9 2.3l1.2 4.2v3.2H3z"/></svg></span>
      <span><b data-shop="name">Tâm Auto</b><span>Quản lý đội xe</span></span>
    </div>
    <nav class="side-nav" id="tabs"></nav>
    <div class="side-foot">
      <div class="usercard">
        <span class="av" id="me-av">T</span>
        <span style="flex:1;min-width:0"><b id="me-name">—</b><span id="me-role">—</span></span>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost sm" id="btn-logout" style="flex:1">Đổi vai trò</button>
        <button class="theme-btn" id="btn-theme" title="Đổi nền sáng/tối" aria-label="Đổi nền sáng tối">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
        </button>
      </div>
      <a class="tiny muted center" href="index.html" style="text-decoration:none">Xem trang khách →</a>
    </div>
  </aside>

  <!-- ============================= NỘI DUNG ============================= -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="btn-menu" aria-label="Mở menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="page-title">Tổng quan</h1>
      <span class="spacer"></span>
      <span class="badge info plain" id="today-badge"></span>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script src="assets/js/store.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
